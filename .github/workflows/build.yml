{"name": "Build APK", "on": {"push": {"paths-ignore": ["apk/**"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"run": "unzip -o -q DunesEnglish-Android.zip -d src && sed -i 's/html,body{margin:0;min-height:100%;overflow-x:hidden}/html,body{margin:0;min-height:100%}body{overflow-x:clip}/' src/android/app/src/main/assets/index.html && grep -c 'body{overflow-x:clip}' src/android/app/src/main/assets/index.html && sed -i 's/versionCode 21/versionCode 22/; s/versionName \"9.3\"/versionName \"9.4\"/' src/android/app/build.gradle && cd src/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Rihlat-English-apk", "path": "src/android/app/build/outputs/apk/debug/app-debug.apk"}}, {"run": "mkdir -p apk && cp src/android/app/build/outputs/apk/debug/app-debug.apk apk/Rihlat-English.apk && git config user.name build-bot && git config user.email bot@users.noreply.github.com && git add apk/Rihlat-English.apk && git commit -m 'Add built APK' && git push"}]}}}
